<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Слова родителей невесты</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #faf7f2; color: #4a4a4a; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); max-width: 400px; width: 100%; text-align: center; }
        h1 { font-size: 22px; color: #2c3e50; margin-bottom: 5px; font-weight: 600;}
        p { font-size: 15px; color: #7f8c8d; margin-bottom: 25px; font-style: italic; }
        .track { margin-bottom: 20px; text-align: left; }
        .title { font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #d35400; }
        audio { width: 100%; outline: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Родители Невесты ❤️</h1>
        <p>Самые дорогие слова</p>

        <div class="track">
            <div class="title">Голос Мамы</div>
            <audio controls preload="metadata">
                <source src="mama-nevesty.mp3" type="audio/mpeg">
            </audio>
        </div>

        <div class="track">
            <div class="title">Голос Юры</div>
            <audio controls preload="metadata">
                <source src="papayr-nevesty.mp3" type="audio/mpeg">
            </audio>
        </div>
    </div>
</body>
</html>
